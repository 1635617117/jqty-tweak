name: Build PacketLog IPA

on:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile App
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/Payload/PacketLog.app

          clang -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -F "$SDK/System/Library/Frameworks" \
            -framework UIKit -framework Foundation -framework CFNetwork \
            -fobjc-arc -ObjC \
            -o build/Payload/PacketLog.app/JQTYApp \
            main.m

          cp Info.plist build/Payload/PacketLog.app/

      - name: Sign with ldid
        run: |
          brew install ldid
          ldid -S build/Payload/PacketLog.app/JQTYApp

      - name: Package IPA
        run: |
          cd build
          zip -qr ../PacketLog.ipa Payload/
          cd ..
          ls -la PacketLog.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PacketLog-IPA
          path: PacketLog.ipa
          if-no-files-found: error
