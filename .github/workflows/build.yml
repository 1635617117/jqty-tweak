name: Build JQTYPacketLog

on:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo git clone --recursive --depth 1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          mkdir -p .theos/obj/debug/arm64
          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -install_name /Library/MobileSubstrate/DynamicLibraries/JQTYPacketLog.dylib \
            -F "$SDK/System/Library/Frameworks" \
            -framework Foundation \
            -framework Security \
            -framework CFNetwork \
            -framework UIKit \
            -lobjc \
            -ObjC \
            -fobjc-arc \
            -fobjc-abi-version=2 \
            -std=c++11 \
            -Wno-deprecated-declarations \
            -Wl,-U,_MSHookFunction \
            -Wl,-U,_MSHookMessageEx \
            -Wl,-undefined,dynamic_lookup \
            -o .theos/obj/debug/arm64/JQTYPacketLog.dylib \
            Tweak.xm
          echo "Compilation exit code: $?"
          ls -la .theos/obj/debug/arm64/JQTYPacketLog.dylib
          file .theos/obj/debug/arm64/JQTYPacketLog.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: JQTYPacketLog-dylib
          path: |
            .theos/obj/debug/arm64/JQTYPacketLog.dylib
            *.plist
          if-no-files-found: error
