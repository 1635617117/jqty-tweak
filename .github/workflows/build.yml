name: Build JQTYPacketLog

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build
          clang++ -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -install_name /Library/MobileSubstrate/DynamicLibraries/JQTYPacketLog.dylib \
            -F "$SDK/System/Library/Frameworks" \
            -framework Foundation \
            -framework Security \
            -framework CFNetwork \
            -framework UIKit \
            -lobjc \
            -ObjC \
            -fobjc-arc \
            -x objective-c++ \
            -o build/JQTYPacketLog.dylib \
            Tweak.mm
          echo "=== Build done ==="
          ls -la build/JQTYPacketLog.dylib
          file build/JQTYPacketLog.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: JQTYPacketLog-dylib
          path: build/JQTYPacketLog.dylib
          if-no-files-found: error
